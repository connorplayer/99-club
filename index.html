<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Bearings — learning kits that give you the history, timeline, map, and vocabulary for the conflicts shaping the news.">
<title>Bearings — Learning kits for what's actually happening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEAE0;
    --surface: #F7F3E9;
    --surface-2: #E4DCC7;
    --text: #1C2536;
    --text-soft: #565F72;
    --accent: #A8461F;
    --accent-soft: #C9714A;
    --accent-2: #2F5A66;
    --border: #CFC6AE;
    --face-back-bg: #1C2536;
    --face-back-text: #F2EDE0;
    --shadow: 0 14px 30px rgba(28,37,54,0.16);
    --overlay: rgba(20,24,32,0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12161F; --surface: #1A1F2B; --surface-2: #232A38;
      --text: #E7E1D3; --text-soft: #A8A192; --accent: #D9835A;
      --accent-soft: #E8A683; --accent-2: #7FAAB3; --border: #333B4A;
      --face-back-bg: #2A3244; --face-back-text: #F2EDE0;
      --shadow: 0 14px 30px rgba(0,0,0,0.45); --overlay: rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161F; --surface: #1A1F2B; --surface-2: #232A38;
    --text: #E7E1D3; --text-soft: #A8A192; --accent: #D9835A;
    --accent-soft: #E8A683; --accent-2: #7FAAB3; --border: #333B4A;
    --face-back-bg: #2A3244; --face-back-text: #F2EDE0;
    --shadow: 0 14px 30px rgba(0,0,0,0.45); --overlay: rgba(0,0,0,0.65);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--text);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; line-height: 1.2; margin: 0 0 0.6em; color: var(--text); }
  h1 { font-size: clamp(1.9rem, 4vw, 2.9rem); }
  h2 { font-size: clamp(1.4rem, 2.6vw, 1.9rem); }
  h3 { font-size: 1.1rem; }
  p { margin: 0 0 1em; max-width: 64ch; }
  a { color: var(--accent-2); }
  button { font-family: inherit; }
  svg { max-width: 100%; display: block; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.7rem 1.3rem; border-radius: 6px; border: 1px solid transparent; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background .15s ease, border-color .15s ease, transform .08s ease; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #FBF6EC; }
  .btn-primary:hover { background: var(--accent-soft); }
  .btn-secondary { background: var(--accent-2); color: #FBF6EC; }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--accent-2); }
  .btn-lg { padding: 0.95rem 1.8rem; font-size: 1.05rem; }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .link-btn { background: none; border: none; color: var(--accent-2); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; }
  .btn-back { background: none; border: none; color: var(--text-soft); cursor: pointer; padding: 0 0 1.3rem; font-size: 0.95rem; }
  .btn-back:hover { color: var(--accent-2); }

  .site-header { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--paper); z-index: 20; }
  .header-inner { max-width: 1120px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .logo { font-family: 'Source Serif 4', serif; font-size: 1.4rem; font-weight: 700; color: var(--text); text-decoration: none; }
  .header-nav { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
  .user-chip { font-size: 0.88rem; color: var(--text-soft); margin-right: 0.2rem; }
  .theme-toggle { background: none; border: 1px solid var(--border); border-radius: 50%; width: 2.3rem; height: 2.3rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; flex-shrink: 0; }

  main { max-width: 1120px; margin: 0 auto; padding: 0 1.5rem 5rem; }

  .hero { padding: 3.6rem 1.5rem 2.5rem; max-width: 1120px; margin: 0 auto; }
  .hero-inner { display: grid; grid-template-columns: 1.3fr 0.9fr; gap: 3rem; align-items: center; }
  .hero-copy p.hero-sub { color: var(--text-soft); font-size: 1.1rem; }
  .hero-actions { margin-top: 1.6rem; }
  .hero-stat { display: flex; justify-content: center; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 2rem 1.8rem; box-shadow: var(--shadow); transform: rotate(-1.6deg); max-width: 270px; }
  .stat-label { font-size: 0.85rem; color: var(--text-soft); margin: 0 0 0.4em; }
  .stat-number { font-family: 'IBM Plex Mono', monospace; font-size: 2rem; font-weight: 500; color: var(--accent); margin: 0 0 0.35em; }
  .stat-caption { font-size: 0.85rem; color: var(--text-soft); margin: 0; max-width: none; }

  .catalog { padding: 1.6rem 0 2rem; }
  .kit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 1.2rem; margin-top: 1.4rem; }
  .kit-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 1.6rem; display: flex; flex-direction: column; justify-content: space-between; min-height: 190px; }
  .kit-card--soon { opacity: 0.72; }
  .kit-card-top p { color: var(--text-soft); font-size: 0.95rem; margin-bottom: 0; }
  .kit-card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 1.4rem; gap: 0.6rem; }
  .kit-price { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .kit-soon { font-size: 0.85rem; color: var(--text-soft); font-style: italic; }

  .how { padding: 2.2rem 0 1rem; border-top: 1px solid var(--border); margin-top: 0.5rem; }
  .how-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 1.5rem; margin-top: 1.3rem; }
  .how-item p { color: var(--text-soft); font-size: 0.95rem; }

  .kit-detail-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 2.4rem; align-items: start; margin-top: 0.5rem; }
  .kit-detail-sub { color: var(--text-soft); font-size: 1.15rem; }
  .kit-stats { list-style: none; padding: 0; margin: 1.4rem 0 0; display: flex; gap: 1.6rem; flex-wrap: wrap; }
  .kit-stats li { font-size: 0.9rem; color: var(--text-soft); }
  .kit-stats strong { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 1.25rem; color: var(--text); }
  .kit-purchase-card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 1.7rem; position: sticky; top: 5.5rem; }
  .kit-price-lg { font-family: 'IBM Plex Mono', monospace; font-size: 2rem; margin: 0; }
  .kit-price-note { color: var(--text-soft); font-size: 0.88rem; margin-top: 0.2rem; }
  .demo-note { font-size: 0.82rem; color: var(--text-soft); margin-top: 0.9rem; margin-bottom: 0; }
  .coming-soon-note { color: var(--text-soft); }

  .dashboard h1 { margin-bottom: 0.25em; }
  .tab-bar { display: flex; gap: 0.2rem; border-bottom: 1px solid var(--border); overflow-x: auto; margin: 1.1rem 0 2rem; }
  .tab { background: none; border: none; padding: 0.8rem 1rem; font-size: 0.95rem; color: var(--text-soft); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab--active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .overview-lead { font-size: 1.1rem; }
  .overview-grid { display: flex; gap: 2rem; margin: 1.3rem 0; flex-wrap: wrap; }
  .overview-grid h3 { font-family: 'IBM Plex Mono', monospace; font-size: 1.6rem; margin-bottom: 0.1em; }
  .overview-grid p { color: var(--text-soft); font-size: 0.85rem; margin: 0; max-width: none; }
  .overview-note { font-size: 0.85rem; color: var(--text-soft); font-style: italic; margin-top: 1.6rem; }

  .workbook-chapter { padding: 1.5rem 0; border-top: 1px solid var(--border); }
  .workbook-chapter:first-child { border-top: none; padding-top: 0; }
  .chapter-num { font-family: 'IBM Plex Mono', monospace; color: var(--accent); margin-right: 0.5rem; font-size: 0.85em; }
  .workbook-chapter p { max-width: 66ch; }

  .flashcards { max-width: 520px; }
  .flash-progress { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; color: var(--text-soft); }
  .flash-card { perspective: 1200px; cursor: pointer; margin: 1rem 0 1.4rem; }
  .flash-card-inner { position: relative; width: 100%; height: 280px; transition: transform 0.5s cubic-bezier(.2,.7,.3,1); transform-style: preserve-3d; }
  .flash-card--flipped .flash-card-inner { transform: rotateY(180deg); }
  .flash-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  .flash-face--front { background: var(--surface); border: 1px solid var(--border); }
  .flash-face--front p { font-size: 1.2rem; font-family: 'Source Serif 4', serif; max-width: none; }
  .flash-hint { position: absolute; bottom: 1rem; font-size: 0.78rem; color: var(--text-soft); }
  .flash-face--back { background: var(--face-back-bg); color: var(--face-back-text); transform: rotateY(180deg); }
  .flash-face--back p { font-size: 1.03rem; max-width: none; margin: 0; }
  .flash-controls { display: flex; gap: 0.6rem; }

  .timeline { position: relative; padding-left: 1.6rem; border-left: 2px solid var(--border); }
  .timeline-event { position: relative; padding-bottom: 1.7rem; }
  .timeline-event::before { content: ''; position: absolute; left: -1.72rem; top: 0.3rem; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .timeline-date { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--accent); margin-bottom: 0.2rem; }
  .timeline-body h3 { margin-bottom: 0.2em; font-size: 1.03rem; }
  .timeline-body p { color: var(--text-soft); font-size: 0.94rem; margin: 0; }

  .map-tab svg { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .map-label { font-family: 'Public Sans', sans-serif; font-size: 13px; fill: var(--text-soft); }
  .map-city { font-family: 'Public Sans', sans-serif; font-size: 12px; fill: var(--text); font-weight: 600; }
  .map-caption { font-size: 0.85rem; color: var(--text-soft); margin-top: 0.8rem; }

  .modal-overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50; }
  .modal { background: var(--paper); border-radius: 12px; padding: 2rem; max-width: 400px; width: 100%; position: relative; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 0.8rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-soft); line-height: 1; }
  .modal-sub { color: var(--text-soft); font-size: 0.92rem; }
  .field { display: block; margin-bottom: 1rem; }
  .field span { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-soft); }
  .field input { width: 100%; padding: 0.65rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.95rem; }
  .field-row { display: flex; gap: 0.8rem; }
  .field-row .field { flex: 1; }
  .modal-switch { font-size: 0.88rem; color: var(--text-soft); text-align: center; margin-top: 1rem; margin-bottom: 0; max-width: none; }
  .demo-banner { background: var(--surface-2); border: 1px dashed var(--border); border-radius: 8px; padding: 0.8rem 1rem; font-size: 0.85rem; color: var(--text-soft); margin-bottom: 1.2rem; max-width: none; }

  .site-footer { border-top: 1px solid var(--border); padding: 2rem 1.5rem; text-align: center; }
  .site-footer p { color: var(--text-soft); font-size: 0.82rem; max-width: 100%; margin: 0 auto; }

  @media (max-width: 800px) {
    .hero-inner { grid-template-columns: 1fr; }
    .hero-stat { order: -1; }
    .kit-detail-grid { grid-template-columns: 1fr; }
    .kit-purchase-card { position: static; }
  }
  @media (max-width: 520px) {
    .header-inner { padding: 0.8rem 1rem; }
    .logo { font-size: 1.2rem; }
    main, .hero, .catalog { padding-left: 1rem; padding-right: 1rem; }
    .kit-stats { gap: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function daysSince(dateStr){
    var start = new Date(dateStr + 'T00:00:00Z');
    var now = new Date();
    return Math.floor((now - start) / 86400000) + 1;
  }

  var UKRAINE_WAR_DAYS = daysSince('2022-02-24');
  var NOW_MONTH_YEAR = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  var CH6_INTRO = '<p>As of ' + NOW_MONTH_YEAR + ', the war is still active &mdash; day ' + UKRAINE_WAR_DAYS.toLocaleString() + ' since the full-scale invasion began &mdash; and Russia controls roughly 20% of Ukraine\'s internationally recognized territory, including Crimea, nearly all of Luhansk, and parts of Donetsk, Zaporizhzhia, and Kherson.</p>';

  var UKRAINE_MAP_SVG = '<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simplified schematic map of Ukraine, Russia, and neighboring countries, showing regions under Russian occupation">' +
    '<rect x="0" y="0" width="900" height="700" fill="var(--surface)"/>' +
    '<rect x="255" y="25" width="330" height="70" rx="14" fill="var(--surface-2)" stroke="var(--border)"/>' +
    '<text x="420" y="65" text-anchor="middle" class="map-label">Belarus</text>' +
    '<rect x="630" y="25" width="250" height="480" rx="14" fill="var(--surface-2)" stroke="var(--border)"/>' +
    '<text x="755" y="58" text-anchor="middle" class="map-label">Russia</text>' +
    '<rect x="70" y="110" width="150" height="260" rx="14" fill="var(--surface-2)" stroke="var(--border)"/>' +
    '<text x="145" y="225" text-anchor="middle" class="map-label"><tspan x="145" dy="0">Poland,</tspan><tspan x="145" dy="15">Slovakia,</tspan><tspan x="145" dy="15">Hungary</tspan></text>' +
    '<rect x="120" y="420" width="220" height="90" rx="14" fill="var(--surface-2)" stroke="var(--border)"/>' +
    '<text x="230" y="470" text-anchor="middle" class="map-label">Romania</text>' +
    '<rect x="340" y="405" width="78" height="90" rx="10" fill="var(--surface-2)" stroke="var(--border)"/>' +
    '<text x="379" y="455" text-anchor="middle" class="map-label" font-size="11">Moldova</text>' +
    '<rect x="60" y="540" width="760" height="62" rx="16" fill="var(--accent-2)" opacity="0.16"/>' +
    '<text x="440" y="576" text-anchor="middle" class="map-label">Black Sea</text>' +
    '<polygon points="260,190 330,150 430,140 520,150 590,175 615,215 618,270 605,320 590,365 555,405 500,435 430,445 360,435 300,410 265,360 250,290 250,230" fill="var(--surface)" stroke="var(--text)" stroke-width="2.5"/>' +
    '<text x="400" y="230" text-anchor="middle" class="map-label" font-weight="600" fill="var(--text)">Ukraine</text>' +
    '<polygon points="555,265 615,265 618,320 600,360 560,355 545,300" fill="var(--accent)" fill-opacity="0.4" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>' +
    '<polygon points="460,375 555,365 565,405 530,430 460,427 440,400" fill="var(--accent)" fill-opacity="0.28" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>' +
    '<rect x="465" y="433" width="24" height="18" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/>' +
    '<polygon points="440,451 520,446 545,473 528,503 480,508 448,483" fill="var(--accent)" fill-opacity="0.48" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>' +
    '<text x="490" y="480" text-anchor="middle" class="map-label" font-size="11">Crimea</text>' +
    '<circle cx="360" cy="270" r="6" fill="var(--text)"/><text x="372" y="266" class="map-city">Kyiv</text>' +
    '<circle cx="560" cy="255" r="5" fill="var(--text)"/><text x="572" y="252" class="map-city">Kharkiv</text>' +
    '<circle cx="290" cy="215" r="5" fill="var(--text)"/><text x="262" y="205" class="map-city">Lviv</text>' +
    '<circle cx="460" cy="345" r="5" fill="var(--text)"/><text x="470" y="343" class="map-city">Dnipro</text>' +
    '<circle cx="380" cy="420" r="5" fill="var(--text)"/><text x="330" y="414" class="map-city">Odesa</text>' +
    '<circle cx="565" cy="350" r="5" fill="var(--text)"/><text x="575" y="368" class="map-city">Mariupol</text>' +
    '<g transform="translate(60,625)">' +
      '<rect x="0" y="0" width="16" height="16" fill="var(--surface)" stroke="var(--text)" stroke-width="1.5"/>' +
      '<text x="22" y="12" class="map-label">Ukrainian government control</text>' +
      '<rect x="0" y="28" width="16" height="16" fill="var(--accent)" fill-opacity="0.4" stroke="var(--accent)" stroke-dasharray="3 2"/>' +
      '<text x="22" y="40" class="map-label">Occupied or annexed by Russia</text>' +
    '</g>' +
  '</svg>';

  var KITS = {
    'ukraine-russia': {
      id: 'ukraine-russia',
      title: 'Russia and Ukraine',
      subtitle: "How a decades-old fault line became Europe's largest war since 1945",
      price: 9.99,
      status: 'available',
      overview: "A war that began in 2014 and escalated, in February 2022, into the largest armed conflict in Europe since the Second World War. This kit covers how it started, how it has unfolded, how each side explains it, and where things stand today.",
      workbook: [
        { heading: 'The short version', body:
          '<p>In February 2022, Russia launched a full-scale invasion of its neighbor Ukraine &mdash; the escalation of a war that had actually started eight years earlier, in 2014, over Crimea and the eastern region known as the Donbas. What Vladimir Putin reportedly expected to be a matter of days became the largest and deadliest war in Europe since 1945.</p>' +
          '<p>By 2026, the front line has barely moved in over a year. Russia controls roughly a fifth of Ukraine\'s internationally recognized territory. Diplomats have spent much of 2025 and 2026 negotiating over a US-brokered peace framework that neither side has fully accepted. Millions of people have been displaced, and the war\'s effects &mdash; on food prices, energy markets, and the rules governing international borders &mdash; reach far beyond the two countries actually fighting.</p>'
        },
        { heading: 'Where this started', body:
          '<p>Ukraine and Russia share more than a border &mdash; centuries of tangled history, a Soviet past, and a badly bruised relationship since. Ukraine declared independence as the USSR collapsed in 1991. In 1994, it gave up the Soviet nuclear weapons stationed on its soil in exchange for security assurances from the US, UK, and Russia &mdash; a deal known as the Budapest Memorandum, whose weak wording (assurances, not guarantees) is frequently cited today.</p>' +
          '<p>Two popular uprisings shaped the years that followed: the 2004 Orange Revolution, and the 2013&ndash;14 Euromaidan protests, sparked when President Viktor Yanukovych &mdash; under pressure from Moscow &mdash; walked away from a trade agreement with the European Union. Yanukovych fled the country in February 2014, and Russia responded within days.</p>'
        },
        { heading: '2014: the first war', body:
          '<p>Unmarked Russian soldiers &mdash; nicknamed "little green men" &mdash; appeared in Crimea in late February 2014. Weeks later, Russia annexed the peninsula after a referendum that most of the world considers illegal under international law and refuses to recognize.</p>' +
          '<p>At the same time, Russian-backed separatists declared breakaway "people\'s republics" in the Donetsk and Luhansk regions of eastern Ukraine, together known as the Donbas. A grinding war there killed roughly 14,000 people between 2014 and 2022. Two ceasefire agreements, Minsk I and Minsk II, were signed and never fully honored by either side.</p>'
        },
        { heading: '2022: the invasion', body:
          '<p>On February 24, 2022, Russia attacked Ukraine on multiple fronts at once, aiming &mdash; according to Western intelligence assessments &mdash; to take Kyiv within days and replace the government. It didn\'t happen. Ukrainian resistance, combined with logistical failures on the Russian side, forced a retreat from northern Ukraine by early April. In the town of Bucha, near Kyiv, the withdrawal revealed evidence of civilian killings that international investigators have treated as potential war crimes.</p>' +
          '<p>The war then shifted into a grinding fight for territory in the east and south. Russia besieged and eventually captured the port city of Mariupol in May 2022. Ukraine answered with two counteroffensives that autumn, retaking Kharkiv-region territory and the city of Kherson. Since then, gains on both sides have come slowly and at enormous cost &mdash; Avdiivka fell to Russian forces in February 2024, while a heavily anticipated 2023 Ukrainian counteroffensive gained only a few miles of ground.</p>'
        },
        { heading: 'Two stories of the same war', body:

      }
    } catch(e) {}

    var email = emailInput ? emailInput.value.trim() : '';
    if (!email){ if (emailInput) emailInput.focus(); return; }
    if (ui.authMode === 'signup'){
      var nameInput = document.getElementById('auth-name');
      var name = nameInput ? nameInput.value.trim() : '';
      state.user = { name: name || email.split('@')[0], email: email };
    } else {
      state.user = (state.user && state.user.email === email) ? state.user : { name: email.split('@')[0], email: email };
    }
    saveState();
    ui.authOpen = false;
    if (ui.pendingPurchase){ ui.pendingPurchase = false; ui.checkoutOpen = true; }
    render();
  }

  function handleAction(action, el){
    if (action === 'go-home'){ ui.view = 'home'; ui.authOpen = false; ui.checkoutOpen = false; render(); window.scrollTo(0,0); return; }
    if (action === 'view-kit'){ ui.activeKit = el.getAttribute('data-kit'); ui.view = 'kit'; ui.activeTab = 'overview'; ui.cardIndex = 0; ui.cardFlipped = false; render(); window.scrollTo(0,0); return; }
    if (action === 'set-tab'){ ui.activeTab = el.getAttribute('data-tab'); ui.cardIndex = 0; ui.cardFlipped = false; render(); return; }
    if (action === 'open-auth'){ ui.authOpen = true; ui.authMode = el.getAttribute('data-mode') || 'signup'; render(); return; }
    if (action === 'close-modal'){ closeModal(); return; }
    if (action === 'switch-auth'){ ui.authMode = ui.authMode === 'signup' ? 'login' : 'signup'; render(); return; }
    if (action === 'submit-auth'){ submitAuth(); return; }
    if (action === 'logout'){ state.user = null; saveState(); render(); return; }
    if (action === 'buy-kit'){
      if (!state.user){ ui.authOpen = true; ui.authMode = 'signup'; ui.pendingPurchase = true; render(); return; }
      ui.checkoutOpen = true; render(); return;
    }
    if (action === 'confirm-purchase'){
      var kitId = ui.activeKit;
      if (state.purchases.indexOf(kitId) === -1) state.purchases.push(kitId);
      saveState();
      ui.checkoutOpen = false; ui.activeTab = 'overview';
      render();
      return;
    }
    if (action === 'flip-card'){ ui.cardFlipped = !ui.cardFlipped; render(); return; }
    if (action === 'next-card'){
      var kit1 = KITS[ui.activeKit];
      if (ui.cardIndex < kit1.flashcards.length - 1){ ui.cardIndex++; ui.cardFlipped = false; render(); }
      return;
    }
    if (action === 'prev-card'){
      if (ui.cardIndex > 0){ ui.cardIndex--; ui.cardFlipped = false; render(); }
      return;
    }
    if (action === 'toggle-theme'){ cycleTheme(); return; }
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && (ui.authOpen || ui.checkoutOpen)) closeModal();
  });

  document.addEventListener('click', function(e){
    var overlay = e.target.classList && e.target.classList.contains('modal-overlay');
    if (overlay){ closeModal(); return; }
    var target = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!target) return;
    handleAction(target.getAttribute('data-action'), target);
  });

  applyTheme();
  render();
})();
</script>
</body>
</html>
